# buildkite-agent pipeline upload .buildkite/pipeline-npu.yaml

# This pipeline is for running NPU tests on PRs . 
steps:
  - group: ":card_index_dividers: npu test"
    key: npu-test-steps
    steps:
      - label: ":pytest: NPU tests"
        key: npu-tests
        agents:
          queue: "linux-small"
        plugins:
          - docker#v5.0.0:
              image: "quay.io/ascend/vime:vime-latest"
              environment:
                - HF_HOME=/root/.cache/huggingface
                - VIME_TEST_ENABLE_INFINITE_RUN=false
              # Expand additional environment variables here as needed, e.g.:
              # - VIME_TEST_USE_DEEPEP=0
              volumes:
                - /dev/shm:/dev/shm
                - /mnt/hf-cache:/root/.cache/huggingface
        timeout_in_minutes: 60
        # The npu test cases to be executed have not been determined yet.
        command: |
            set -euo pipefail
            PR="${BUILDKITE_PULL_REQUEST:-false}"
            [ "$PR" = "false" ] && PR="non-pr"
            export GITHUB_COMMIT_NAME="${BUILDKITE_COMMIT}_${PR}"
            pip install -e . --no-deps --break-system-packages
            python -c "print('test-npu')"
