# buildkite-agent pipeline upload .buildkite/pipeline-npu.yaml

# This pipeline is for running NPU tests on PRs . 
steps:
  - label: "Run NPU test via Docker"
    key: npu-tests
    agents:
      queue: "macos-medium"
    timeout_in_minutes: 60
    command: |
      set -euo pipefail

      # 确保 Docker 可用
      docker info || (echo "Docker not running" && exit 1)

      # 拉取镜像（若本地不存在）
      docker pull quay.io/ascend/vime:vime-latest

      # 准备宿主机目录（如果使用 hostPath）
      mkdir -p /mnt/hf-cache

      # 执行容器
      docker run --rm \
        --name "vime-test-${BUILDKITE_BUILD_NUMBER}" \
        --device /dev/davinci0 \          # 若无需 NPU 可删除
        --device /dev/davinci_manager \
        --device /dev/devmm_svm \
        --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /dev/shm:/dev/shm \
        -v /mnt/hf-cache:/root/.cache/huggingface \
        -e HF_HOME=/root/.cache/huggingface \
        -e VIME_TEST_ENABLE_INFINITE_RUN=false \
        -e BUILDKITE_PULL_REQUEST="${BUILDKITE_PULL_REQUEST:-false}" \
        -e BUILDKITE_COMMIT="${BUILDKITE_COMMIT}" \
        -e GITHUB_COMMIT_NAME="${BUILDKITE_COMMIT}_${BUILDKITE_PULL_REQUEST:-non-pr}" \
        --network host \
        quay.io/ascend/vime:vime-latest \
        bash -c "
          set -euo pipefail
          pip install -e . --no-deps --break-system-packages || pip install -e . --no-deps
          python -c \"print('test-npu')\"
        "
